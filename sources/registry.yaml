# Canonical external knowledge sources.
#
# IMPORTANT:
# - This file records the source state last VERIFIED by this repository.
# - It is not proof that the source has not changed since `last_verified`.
# - Re-verify primary sources before claiming alignment with "latest" guidance.
# - `current_version: "rolling"` is valid for sources without discrete releases.
# - Record `published` only when a publication or release date exists and can be established.
#
# Initialized: 2026-09-01

schema_version: 1
last_registry_review: "2026-09-01"

sources:
  owasp-agent-control-standard:
    name: "OWASP Agent Control Standard (ACS)"
    role: "reference"
    canonical_url: "https://github.com/GenAI-Security-Project/agent-control-standard"
    status: "public-preview"
    current_version: "main; version.txt reports 0.1.1"
    last_verified: "2026-09-09"
    verification_urls:
      - "https://genai.owasp.org/resource/agent-control-standard-acs/"
      - "https://github.com/GenAI-Security-Project/agent-control-standard/blob/main/version.txt"
      - "https://genai-security-project.github.io/agent-control-standard/docs/spec/conformance/"
    notes: >-
      Supplementary runtime-control technical specification, not a control backbone
      or mandatory Pattern dependency/conformance target. OWASP introduction is
      dated 2026-09-01; this does not establish a stable specification release.
      README refers to Public Preview while conformance documentation refers to
      v0.1.0. Resolve document/version differences and pin the relevant revision
      before substantive use. See engineering/docs/source-policy.md.

  owasp-secure-agent-playbook:
    name: "OWASP Secure Agent Playbook"
    role: "reference"
    canonical_url: "https://github.com/OWASP/secure-agent-playbook"
    status: "rolling"
    current_version: "rolling main procedures; release page lists v0.2.7 as latest"
    last_verified: "2026-09-09"
    verification_urls:
      - "https://github.com/OWASP/secure-agent-playbook"
      - "https://github.com/OWASP/secure-agent-playbook/releases"
    notes: >-
      Supplementary analysis, review, and verification procedures, not a normative
      control standard or mandatory Pattern dependency. Rolling describes the main
      branch procedures consulted, not an upstream maturity certification; release
      packages and main may differ. Pin the relevant play revision when used.
      Independently verify cited standards and mappings. Registration does not
      authorize installation or execution of skills/plugins and does not establish
      security, reproducibility, or coverage. See engineering/docs/source-policy.md.

  owasp-aisvs:
    name: "OWASP Artificial Intelligence Security Verification Standard (AISVS)"
    role: "control"
    canonical_url: "https://github.com/OWASP/AISVS"
    status: "stable"
    current_version: "1.0"
    development_version: "1.01-dev"
    identifier_guidance: "Prefer versioned IDs such as v1.0-C9.4.3"
    last_verified: "2026-09-01"
    notes: "Primary verification/control backbone. Stable release directories are intended to remain fixed while development continues in a new version directory."

  mitre-atlas:
    name: "MITRE ATLAS"
    role: "adversary"
    canonical_url: "https://atlas.mitre.org/"
    status: "rolling"
    current_version: "rolling"
    last_verified: "2026-09-01"
    notes: "Primary adversary behavior/TTP taxonomy for AI-enabled systems. Treat technique/tactic changes as taxonomy changes requiring mapping review."

  owasp-genai-llm-top10:
    name: "OWASP GenAI LLM Top 10 2026"
    role: "risk"
    canonical_url: "https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/"
    status: "stable"
    current_version: "2026"
    published: "2026-08-03"
    last_verified: "2026-09-01"
    notes: "LLM application risk taxonomy; do not use as the physical repository taxonomy."

  owasp-agentic-top10:
    name: "OWASP Top 10 for Agentic Applications 2026"
    role: "risk"
    canonical_url: "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/"
    status: "stable"
    current_version: "2026"
    published: "2025-12-09"
    last_verified: "2026-09-01"
    notes: "Agentic application risk taxonomy."

  owasp-mcp-top10:
    name: "OWASP MCP Top 10"
    role: "risk"
    canonical_url: "https://owasp.org/www-project-mcp-top-10/"
    status: "beta"
    current_version: "beta; published risk identifiers are labeled 2025"
    next_planned_release: "2026-10"
    last_verified: "2026-09-01"
    notes: "Living MCP-specific risk taxonomy. Because it is beta, do not present its classifications as a stable verification standard."

  owasp-agentic-skills-top10:
    name: "OWASP Agentic Skills Top 10"
    role: "risk"
    canonical_url: "https://owasp.org/www-project-agentic-skills-top-10/"
    status: "public-review"
    current_version: "v1 draft/public review"
    last_verified: "2026-09-01"
    notes: "Agent-skill and behavior-layer risk taxonomy. Particularly relevant to Codex/Claude Code/Cursor-style reusable agent instructions and tool orchestration."

  owasp-ai-exchange:
    name: "OWASP AI Exchange"
    role: "reference"
    canonical_url: "https://owasp.org/www-project-ai-security-and-privacy-guide/"
    status: "rolling"
    current_version: "rolling"
    last_verified: "2026-09-01"
    notes: "Broad supporting AI security and privacy knowledge base. Use as research/context rather than a control backbone."
