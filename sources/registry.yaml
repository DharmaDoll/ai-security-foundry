    last_verified: "2026-09-01"
    notes: "Living MCP-specific risk taxonomy. Because it is beta, do not present its classifications as a stable verification standard."

  owasp-agentic-skills-top10:
    name: "OWASP Agentic Skills Top 10"
    role: "risk"
    canonical_url: "https://owasp.org/www-project-agentic-skills-top-10/"
