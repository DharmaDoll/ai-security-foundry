        upstream_revision: 41d4f5ca4112f0e492ffaa3ebff07dc80a75afa5
        identifier: AML.T0053
        title: AI Agent Tool Invocation
        relationship: mitigates
        strength: partial
        status: proposed
        rationale: >-
          Tool invocation gives a compromised or manipulated Agent an opportunity
          to attack its authorization boundary. PDP isolation limits the Agent's
          ability to modify or replace the decision authority, but it does not
          guarantee that every Tool is mediated or that Policy is correct.
        source_url: https://github.com/mitre-atlas/atlas-data/blob/41d4f5ca4112f0e492ffaa3ebff07dc80a75afa5/dist/v6/ATLAS-2026.08.yaml
        last_assessed: "2026-09-03"
      - source_key: mitre-atlas
        source_version: "2026.08"
        source_status: rolling
        upstream_revision: 41d4f5ca4112f0e492ffaa3ebff07dc80a75afa5
        identifier: AML.T0051
        title: LLM Prompt Injection
        relationship: context
        strength: context
        status: proposed
        rationale: >-
          Prompt Injection is one route to Agent influence. PDP isolation contains
          compromise of the authorization control plane after that influence, but
          does not prevent or detect Prompt Injection itself.
        source_url: https://github.com/mitre-atlas/atlas-data/blob/41d4f5ca4112f0e492ffaa3ebff07dc80a75afa5/dist/v6/ATLAS-2026.08.yaml
