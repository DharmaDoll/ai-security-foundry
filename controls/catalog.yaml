        identifier: AML.T0057
        title: LLM Data Leakage
        relationship: mitigates
        strength: partial
        status: proposed
        rationale: >-
          The ATLAS snapshot includes information from other LLM users among the
          possible leaked data. Tenant-isolated model-serving state reduces one
          infrastructure path to that outcome, but AML.T0057 also covers leakage
          through training data, connected data sources, Prompt Injection, and
          failures outside shared serving infrastructure.
